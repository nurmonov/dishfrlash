server:
  port: 8080

spring:
  application:
    name: dishflash

  datasource:
    url: jdbc:postgresql://localhost:5432/dishfrlash
    username: postgres
    password: root123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  encryption:
    master-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  jwt:
    secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBqd3Qgc2VjcmV0IGtleSBmb3IgZGV2ZWxvcG1lbnQgb25seQo=}
    expiration-ms: 86400000

logging:
  level:
    com.dishflash: INFO
    org.hibernate.SQL: WARN
